[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cited-research-assistant"
version = "0.1.0"
description = "Page-grounded question answering over uploaded PDFs"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24,<2", "scikit-learn>=1.4,<2", "streamlit>=1.35,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
